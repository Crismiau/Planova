# ===================================================================
# =================== GENERAL CONFIGURATION =====================
# ===================================================================
server:
  port: 8081

# --- JWT Configuration ---
jwt:
  secret: 4b24578978a3c58e722513f50428139d4826456018318222956291681284a580

spring:
  # --- Active Profile ---
  profiles:
    active: dev # Perfil por defecto

  # --- JPA / Hibernate (Common) ---
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 10
        jdbc:
          batch_size: 10
    hibernate:
        ddl-auto: none # Dejar que Flyway maneje el schema

  # --- Flyway (Common) ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # --- SQL Initialization ---
  sql:
    init:
      mode: never # Flyway se encarga de esto

# --- Logging ---
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

# ===================================================================
# =================== DEVELOPMENT PROFILE (dev) =====================
# ===================================================================
---
spring:
  config:
    activate:
      on-profile: dev

  # --- MySQL Database ---
  datasource:
    url: jdbc:mysql://localhost:3306/planova?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driverClassName: com.mysql.cj.jdbc.Driver
  
  # --- H2 Console (Enabled for dev) ---
  h2:
    console:
      enabled: true
      path: /h2-console

# ===================================================================
# ===================== TEST PROFILE (test) =========================
# ===================================================================
---
spring:
  config:
    activate:
      on-profile: test

  # --- H2 In-Memory Database ---
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: root
    password: root

  # --- JPA for Testing ---
  jpa:
    hibernate:
      ddl-auto: create-drop # Crear y destruir el schema para cada test

  # --- Flyway (Disabled for tests, Hibernate handles schema) ---
  flyway:
    enabled: false
