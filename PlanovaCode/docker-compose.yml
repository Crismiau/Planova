
version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: planova-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: planova
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
